/* pick the theme before first paint so there is no flash */
(function(){
  var t = null;
  try { t = localStorage.getItem('cj-editor-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
/* ============================================================
   THEME TOKENS
   ============================================================ */
:root, :root[data-theme="light"]{
  --bg:#FCFCFA;          /* editor surface */
  --bg-side:#F1F3F0;     /* explorer */
  --bg-chrome:#E7EAE6;   /* title bar, tab strip */
  --bg-elev:#FFFFFF;     /* cards */
  --bg-hover:rgba(20,28,36,.06);
  --fg:#141C24;
  --fg-muted:#4F5B64;
  --fg-faint:#626D75;
  --rule:#D9DFE2;
  --rule-strong:#B4BEC4;
  --accent:#1B5B66;
  --accent-ink:#FFFFFF;
  --accent-soft:#E3EEEE;
  --sel:rgba(27,91,102,.12);
  --status-bg:#1B5B66;
  --status-fg:#FFFFFF;
  --focus:#1B5B66;
  --mm-ink:rgba(20,28,36,.22);
  --mm-head:rgba(27,91,102,.75);
  --mm-view:rgba(20,28,36,.08);
  --shadow:0 1px 2px rgba(20,28,36,.06),0 6px 20px rgba(20,28,36,.06);
  /* syntax */
  --t-k:#7A3E9D;  /* keyword */
  --t-s:#2D6A3A;  /* string */
  --t-p:#1D5A9E;  /* property */
  --t-n:#9A4F00;  /* number, literal */
  --t-t:#A1461F;  /* type */
  --t-c:#5E6971;  /* comment */
  --t-u:#4F5B64;  /* punctuation */
  --t-h:#1B5B66;  /* heading */
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#14191E;
  --bg-side:#101418;
  --bg-chrome:#0C0F12;
  --bg-elev:#1A2027;
  --bg-hover:rgba(255,255,255,.06);
  --fg:#DCE3E8;
  --fg-muted:#A9B4BC;
  --fg-faint:#87939D;
  --rule:#252D35;
  --rule-strong:#3A454F;
  --accent:#6CC3CF;
  --accent-ink:#0C1A1D;
  --accent-soft:rgba(108,195,207,.12);
  --sel:rgba(108,195,207,.16);
  --status-bg:#1B5B66;
  --status-fg:#FFFFFF;
  --focus:#6CC3CF;
  --mm-ink:rgba(220,227,232,.20);
  --mm-head:rgba(108,195,207,.8);
  --mm-view:rgba(255,255,255,.07);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --t-k:#D3A6F2;
  --t-s:#A8D8A0;
  --t-p:#8DB8F5;
  --t-n:#F0B27A;
  --t-t:#F2C77E;
  --t-c:#8C99A5;
  --t-u:#A9B4BC;
  --t-h:#6CC3CF;
  color-scheme:dark;
}
/* no script: follow the system */
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#14191E;--bg-side:#101418;--bg-chrome:#0C0F12;--bg-elev:#1A2027;--bg-hover:rgba(255,255,255,.06);
    --fg:#DCE3E8;--fg-muted:#A9B4BC;--fg-faint:#87939D;--rule:#252D35;--rule-strong:#3A454F;
    --accent:#6CC3CF;--accent-ink:#0C1A1D;--accent-soft:rgba(108,195,207,.12);--focus:#6CC3CF;
    color-scheme:dark;
  }
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
  font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
::selection{background:var(--sel)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:8px 12px;text-decoration:none;font-size:14px}
.skip:focus{top:8px}
kbd{font-family:"IBM Plex Mono",monospace;font-size:11px;border:1px solid var(--rule-strong);border-bottom-width:2px;padding:0 5px;border-radius:3px;color:var(--fg-muted);background:var(--bg-elev)}

/* ============================================================
   SHELL
   ============================================================ */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}

.titlebar{
  flex:none;height:42px;display:flex;align-items:center;gap:12px;padding:0 10px 0 14px;
  background:var(--bg-chrome);border-bottom:1px solid var(--rule);font-size:13.5px;
}
.dots{display:flex;gap:7px;flex:none}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--rule-strong)}
.dots i:nth-child(1){background:#E0695F}.dots i:nth-child(2){background:#E5B142}.dots i:nth-child(3){background:#5FB46A}
.tb-title{margin:0;flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg-muted)}
.tb-title strong{color:var(--fg);font-weight:600}
.tb-actions{display:flex;align-items:center;gap:6px;flex:none}
.tb-btn{
  display:inline-flex;align-items:center;justify-content:center;width:32px;height:30px;
  background:none;border:1px solid transparent;border-radius:5px;cursor:pointer;color:var(--fg-muted);
}
.tb-btn:hover{background:var(--bg-hover);color:var(--fg)}
.tb-menu{display:none}
.tb-search{
  display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 8px 0 10px;min-width:200px;
  background:var(--bg);border:1px solid var(--rule);border-radius:6px;cursor:pointer;color:var(--fg-muted);font-size:13px;
}
.tb-search:hover{border-color:var(--rule-strong);color:var(--fg)}
.tb-search .ico{width:15px;height:15px}
.tb-search-label{flex:1;text-align:left}
.tb-cta{
  height:28px;padding:0 12px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
}
.tb-cta:hover{filter:brightness(1.08)}
[data-theme="dark"] .i-sun, :root:not([data-theme="dark"]) .i-moon{display:none}

.workbench{flex:1;min-height:0;display:flex}

.activity{
  flex:none;width:48px;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px;
  background:var(--bg-chrome);border-right:1px solid var(--rule);
}
.act{
  position:relative;width:48px;height:44px;display:flex;align-items:center;justify-content:center;
  background:none;border:0;cursor:pointer;color:var(--fg-faint);
}
.act .ico{width:22px;height:22px;stroke-width:1.5}
.act:hover{color:var(--fg)}
.act[aria-expanded="true"]{color:var(--fg)}
.act[aria-expanded="true"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--accent)}

/* explorer */
.sidebar{
  flex:none;width:256px;display:flex;flex-direction:column;min-height:0;
  background:var(--bg-side);border-right:1px solid var(--rule);font-size:13.5px;
}
.side-collapsed .sidebar{display:none}
.side-head{
  display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 10px 0 18px;flex:none;
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-muted);font-weight:500;
}
.side-close{display:none;background:none;border:0;width:30px;height:30px;font-size:20px;line-height:1;cursor:pointer;color:var(--fg-muted);border-radius:5px}
.side-close:hover{background:var(--bg-hover)}
.side-root{
  margin:0;padding:3px 10px 3px 12px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  display:flex;align-items:center;gap:6px;color:var(--fg);flex:none;
}
.side-root .ico{width:14px;height:14px}
.tree-wrap{flex:1;min-height:0;overflow:auto;padding-bottom:12px}
.tree{list-style:none;margin:0;padding:0}
.tree-row{
  --d:0;display:flex;align-items:center;gap:6px;width:100%;height:26px;
  padding:0 10px 0 calc(14px + var(--d) * 14px);
  background:none;border:0;border-left:2px solid transparent;cursor:pointer;text-align:left;color:var(--fg-muted);
  white-space:nowrap;overflow:hidden;font-size:13.5px;
}
.tree-row span.nm{overflow:hidden;text-overflow:ellipsis}
.tree-row:hover{background:var(--bg-hover);color:var(--fg)}
.tree-row[aria-current="page"]{background:var(--sel);color:var(--fg);border-left-color:var(--accent)}
.tree-dir{color:var(--fg)}
.tree-dir .chev{width:14px;height:14px;transition:transform .15s ease}
.tree-dir[aria-expanded="true"] .chev{transform:rotate(90deg)}
.tree-file{padding-left:calc(34px + var(--d) * 14px)}
.ficon{
  display:inline-flex;align-items:center;justify-content:center;flex:none;width:18px;height:14px;
  font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;border-radius:2px;letter-spacing:-.02em;
  color:var(--fg-muted);
}
.i-ts{color:#2F74C0}.i-md{color:#2D7F8C}.i-json{color:#B07D00}.i-yml{color:#B4475A}
[data-theme="dark"] .i-ts{color:#7DB2EE}[data-theme="dark"] .i-md{color:#6CC3CF}[data-theme="dark"] .i-json{color:#E8C060}[data-theme="dark"] .i-yml{color:#EE8D9C}
.folder{width:15px;height:15px;color:var(--fg-faint)}
.side-sec{
  flex:none;border-top:1px solid var(--rule);padding:10px 18px 14px;
}
.side-sec h2{margin:0 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-muted);font-weight:500}
.side-sec p{margin:0;font-size:13px;line-height:1.5;color:var(--fg-muted)}
.side-sec p strong{color:var(--fg);font-weight:600}
.side-links{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.side-links a{font-size:12.5px;color:var(--fg-muted);text-decoration:none;font-family:"IBM Plex Mono",monospace;overflow-wrap:anywhere}
.side-links a:hover{color:var(--accent);text-decoration:underline}

.scrim{display:none}

/* editor column */
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg)}

.tabs{
  flex:none;display:flex;height:38px;background:var(--bg-chrome);border-bottom:1px solid var(--rule);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;
}
.tabs::-webkit-scrollbar{height:4px}
.tabs::-webkit-scrollbar-thumb{background:var(--rule-strong)}
.tab{
  position:relative;flex:none;display:flex;align-items:center;border-right:1px solid var(--rule);
  background:transparent;color:var(--fg-muted);font-size:13px;
}
.tab.on{background:var(--bg);color:var(--fg)}
.tab.on::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--bg)}
.tab-btn{
  display:flex;align-items:center;gap:6px;height:100%;padding:0 4px 0 12px;background:none;border:0;cursor:pointer;white-space:nowrap;
}
.tab-desc{color:var(--fg-faint);font-size:12px}
.tab-x{
  width:22px;height:22px;margin-right:6px;display:flex;align-items:center;justify-content:center;
  background:none;border:0;border-radius:4px;cursor:pointer;color:var(--fg-faint);font-size:16px;line-height:1;
  opacity:.0;
}
.tab.on .tab-x,.tab:hover .tab-x,.tab-x:focus-visible{opacity:1}
.tab-x:hover{background:var(--bg-hover);color:var(--fg)}
@media (hover:none){.tab-x{opacity:1}}

.crumbs{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:32px;padding:0 12px 0 18px;border-bottom:1px solid var(--rule);font-size:12.5px;color:var(--fg-muted);
}
.crumbs nav{min-width:0;overflow:hidden}
.crumbs ol{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs li{display:flex;align-items:center;gap:4px;min-width:0}
.crumbs li+li::before{content:"\203A";color:var(--fg-faint)}
.crumbs li:last-child{color:var(--fg)}
.mode{display:flex;flex:none;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--bg-side)}
.mode button{
  border:0;background:none;padding:3px 11px;font-size:12px;cursor:pointer;color:var(--fg-muted);
  font-family:"IBM Plex Mono",monospace;
}
.mode button+button{border-left:1px solid var(--rule)}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.mode button:not([aria-pressed="true"]):hover{background:var(--bg-hover);color:var(--fg)}

.editor{flex:1;min-height:0;display:flex}
.scroller{flex:1;min-width:0;overflow:auto;position:relative;scrollbar-width:thin;scrollbar-color:var(--rule-strong) transparent}
.scroller:focus-visible{outline-offset:-2px}

/* minimap */
.minimap{
  flex:none;width:92px;position:relative;border-left:1px solid var(--rule);cursor:pointer;
  background:var(--bg);overflow:hidden;user-select:none;touch-action:none;
}
#mm-bars{position:absolute;inset:6px 10px 6px 10px}
#mm-bars i{
  position:absolute;display:block;border-radius:1px;
  background:repeating-linear-gradient(to bottom,var(--mm-ink) 0 2px,transparent 2px 4px);
}
#mm-bars i.h{background:var(--mm-head)}
#mm-bars i.c{background:var(--mm-ink)}
.mm-view{position:absolute;left:0;right:0;top:0;background:var(--mm-view);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);pointer-events:none}
@media (max-width:1180px){.minimap{display:none}}

/* status bar */
.status{
  flex:none;height:26px;display:flex;align-items:center;gap:2px;padding:0 6px;
  background:var(--status-bg);color:var(--status-fg);font-size:12px;font-family:"IBM Plex Mono",monospace;
  white-space:nowrap;overflow:hidden;
}
.sb{display:inline-flex;align-items:center;gap:5px;padding:0 8px;height:100%}
.sb .ico{width:13px;height:13px;stroke-width:2}
.sb-msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;opacity:.92}
button.sb{background:none;border:0;cursor:pointer;color:inherit;font:inherit}
button.sb:hover{background:rgba(255,255,255,.14)}
.status :focus-visible{outline-color:#fff;outline-offset:-2px}

/* ============================================================
   DOCUMENT (preview and source share the gutter)
   ============================================================ */
.doc{
  --gutter:68px;
  position:relative;counter-reset:ln;
  padding:34px 44px 72px var(--gutter);
  background:linear-gradient(var(--rule),var(--rule)) no-repeat calc(var(--gutter) - 16px) 0 / 1px 100%;
  min-height:100%;
}
:root{--body-lnh:27px}
.ln,.cl{counter-increment:ln;--lnh:var(--body-lnh)}
.ln::before,.cl::before{
  content:counter(ln);position:absolute;left:0;width:calc(var(--gutter) - 28px);text-align:right;
  font:400 12px/var(--lnh) "IBM Plex Mono",monospace;color:var(--fg-faint);opacity:.75;
  pointer-events:none;user-select:none;-webkit-user-select:none;
}
.ln:hover::before,.cl:hover::before{color:var(--fg);opacity:1}
.doc.compiled{animation:compile .35s ease-out}
@keyframes compile{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}

/* prose */
.prose{max-width:none}
.prose > *{max-width:70ch}
.prose > .wide,.prose > section{max-width:1040px}
.prose > section > :not(.wide){max-width:70ch}
.prose h1{
  --fs:clamp(30px,4.2vw,42px);--lnh:calc(var(--fs) * 1.12);
  font-size:var(--fs);line-height:1.12;letter-spacing:-.025em;font-weight:600;margin:0 0 14px;
}
.prose h1:focus{outline:none}
.prose h1:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.prose h2{--lnh:29px;font-size:22px;line-height:1.3;letter-spacing:-.015em;font-weight:600;margin:40px 0 10px}
.prose h2.sec{--lnh:24px;font-size:15.5px;line-height:1.55;letter-spacing:0;color:var(--accent);margin:30px 0 6px}
.prose h3{font-size:16px;font-weight:600;margin:0 0 4px}
.prose p{margin:0 0 14px}
.hash{font-family:"IBM Plex Mono",monospace;font-weight:400;color:var(--fg-faint);opacity:.8;font-size:.82em}
.intro{color:var(--fg-muted);font-size:17.5px;--lnh:29px}
.lede{font-size:19px;line-height:1.6;--lnh:30px}
.lede .quiet{color:var(--fg-muted)}
.eyebrow{
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--fg-muted);margin:0 0 10px !important;
  display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;--lnh:22px;
}
.pill{
  display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.6;
  padding:0 8px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);
}
.pill.solid{background:var(--accent);color:var(--accent-ink)}
.pill.dim{border-color:var(--rule-strong);color:var(--fg-muted)}
.t-k{color:var(--t-k)}.t-s{color:var(--t-s)}.t-p{color:var(--t-p)}.t-n{color:var(--t-n)}
.t-t{color:var(--t-t)}.t-c{color:var(--t-c)}.t-u{color:var(--t-u)}.t-h{color:var(--t-h);font-weight:500}
.list{margin:0 0 14px;padding-left:20px}
.list li{margin-bottom:6px}
.list li::marker{color:var(--accent)}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:7px}
.chips li{
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.5;padding:2px 9px;border-radius:4px;
  background:var(--bg-side);border:1px solid var(--rule);color:var(--fg-muted);
}
.chips li::before{content:"\"";color:var(--t-s);opacity:.7}
.chips li::after{content:"\"";color:var(--t-s);opacity:.7}
.chip-row{margin:14px 0 0 !important;--lnh:28px}

/* README */
.readme h1{--fs:clamp(38px,6vw,62px);letter-spacing:-.035em;margin-bottom:18px}
.spec{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:8px 0 28px;
  border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--bg-elev);
}
.spec div{padding:13px 16px 15px;border-right:1px solid var(--rule)}
.spec div:last-child{border-right:0}
.spec dt{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--t-p);margin-bottom:4px}
.spec dt::after{content:":";color:var(--t-u)}
.spec dd{margin:0;font-size:15px;font-weight:500;line-height:1.4}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px;--lnh:36px}
.qbtn{
  display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 10px;cursor:pointer;
  background:var(--bg-elev);border:1px solid var(--rule);border-radius:6px;font-size:14px;color:var(--fg);
}
.qbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.qbtn .pth{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--fg-faint)}
.hint{font-size:14px;color:var(--fg-muted)}
.foot{font-size:14px;color:var(--fg-muted);border-top:1px solid var(--rule);padding-top:14px;margin-top:30px !important}

/* experience */
.role-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 18px;margin:34px 0 10px;--lnh:29px}
.role-head h2{margin:0}
.org{color:var(--accent);font-weight:500}
.when{margin:0 !important;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--t-c)}

/* selected work */
.kicker{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--t-c);margin:46px 0 4px !important;--lnh:22px}
.case-title{margin-top:0 !important}
.pax{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:16px 0 0}
.pax > div{background:var(--bg-elev);border:1px solid var(--rule);border-radius:8px;padding:14px 16px 16px}
.pax h3{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:500;color:var(--t-k);margin:0 0 6px}
.pax p{margin:0;font-size:15px;line-height:1.6;color:var(--fg-muted)}

/* projects: cards */
.group-h{margin-top:36px !important}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:16px;margin:12px 0 0}
.card{
  position:relative;display:flex;flex-direction:column;background:var(--bg-elev);border:1px solid var(--rule);
  border-radius:9px;overflow:hidden;transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease;
}
.card:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
.card:focus-within{border-color:var(--accent)}
.card-thumb{position:relative;aspect-ratio:21/10;background:var(--bg-side);border-bottom:1px solid var(--rule);overflow:hidden}
.card-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left top}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-file{margin:0 !important;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--fg-faint);overflow-wrap:anywhere}
.card h3{margin:0;font-size:16.5px;line-height:1.35}
.card-open{all:unset;cursor:pointer}
.card-open::after{content:"";position:absolute;inset:0;z-index:1}
.card-open:focus-visible{outline:none}
.card:has(.card-open:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.card-short{margin:0 !important;font-size:14.5px;line-height:1.5;color:var(--fg-muted);flex:1}
.card-meta{margin:8px 0 0 !important;display:flex;justify-content:space-between;gap:10px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--fg-faint)}
.card-meta .go{color:var(--accent)}

/* placeholders for missing or pending images */
[data-fallback] .ph{display:none}
[data-fallback].is-missing img{display:none}
[data-fallback].is-missing .ph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--fg-faint);
  background:
    repeating-linear-gradient(135deg,transparent 0 10px,var(--bg-hover) 10px 11px),
    var(--bg-side);
}

/* project detail: gallery */
.gal{margin:22px 0 8px;max-width:1040px !important}
.gal-stage{position:relative;aspect-ratio:21/10;background:var(--bg-side);border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.gal-zoom{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in;display:block}
.gal-zoom img{width:100%;height:100%;object-fit:contain;display:block}
.gal-zoom:focus-visible{outline-offset:-3px}
.gal-arrow{
  position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--bg-elev);border:1px solid var(--rule-strong);color:var(--fg);box-shadow:var(--shadow);
}
.gal-arrow:hover{border-color:var(--accent);color:var(--accent)}
.gal-arrow.prev{left:10px}.gal-arrow.next{right:10px}
.gal-cap{display:flex;gap:12px;align-items:baseline;margin-top:10px;font-size:14.5px;color:var(--fg-muted);line-height:1.5}
.gal-num{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent);flex:none}
.gal-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.gal-thumb{width:96px;padding:0;border:1px solid var(--rule);border-radius:5px;background:var(--bg-side);cursor:pointer;overflow:hidden;opacity:.7}
.gal-thumb:hover{opacity:1}
.gal-thumb[aria-current="true"]{opacity:1;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.thumb-box{position:relative;display:block;aspect-ratio:21/10}
.thumb-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:left top;display:block}
.gal-hint{margin:8px 0 0 !important;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--fg-faint)}
.gal-none{
  aspect-ratio:21/10;max-height:300px;width:100%;display:flex;align-items:center;justify-content:center;border-radius:9px;
  border:1px dashed var(--rule-strong);font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--fg-faint);
  background:repeating-linear-gradient(135deg,transparent 0 10px,var(--bg-hover) 10px 11px),var(--bg-side);
}

/* pager */
.pager{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin:48px 0 0 !important;padding-top:18px;border-top:1px solid var(--rule);max-width:1040px !important;--lnh:58px}
.pg{
  display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 180px;max-width:320px;padding:10px 14px;cursor:pointer;text-align:left;
  background:var(--bg-elev);border:1px solid var(--rule);border-radius:8px;
}
.pg.next{text-align:right;align-items:flex-end;margin-left:auto}
.pg.up{align-items:center;text-align:center}
.pg:hover{border-color:var(--accent)}
.pg-k{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--fg-faint)}
.pg-f{display:flex;align-items:center;gap:6px;font-weight:500;font-size:14.5px}

/* skills */
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:16px;margin-top:16px}
.skill{background:var(--bg-elev);border:1px solid var(--rule);border-radius:8px;padding:14px 16px}
.skill h2{font-size:15.5px;margin:0 0 8px;letter-spacing:0;display:flex;justify-content:space-between;gap:8px}
.skill h2 .t-n{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:400}
.skill ul{list-style:none;margin:0;padding:0;font-size:14.5px;color:var(--fg-muted)}
.skill li{padding:5px 0;border-top:1px solid var(--rule)}

/* credentials */
.creds{border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin-top:16px;max-width:860px !important}
.cred{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:6px 20px;align-items:baseline;padding:13px 16px;border-top:1px solid var(--rule);background:var(--bg-elev)}
.creds .cred:first-child{border-top:0}
.cred .name{font-weight:500}
.cred .detail{font-size:14.5px;color:var(--fg-muted)}

/* contact */
.contact-list{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.contact-list li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;--lnh:30px}
.contact-list .k{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--t-p);min-width:72px}
.contact-list a{font-size:18px;text-decoration:none;border-bottom:1px solid var(--rule-strong);overflow-wrap:anywhere}
.contact-list a:hover{color:var(--accent);border-bottom-color:var(--accent)}

/* empty editor */
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:12px}

/* source view */
.code-doc{padding-top:22px}
.code{
  margin:0;font:400 13.5px/1.75 "IBM Plex Mono",ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;
  tab-size:2;color:var(--fg);
}
.code code{font:inherit;display:block}
.cl{display:block;min-height:1.75em;--lnh:23.6px;border-radius:2px}
.cl:hover{background:var(--bg-hover)}

/* ============================================================
   VIEWER AND QUICK OPEN
   ============================================================ */
.lb{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:rgba(10,14,18,.95);color:#E6EDF0}
.lb[hidden]{display:none}
.lb-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.14);flex:none}
.lb-title{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-size:14.5px}
.lb-nav{display:flex;gap:8px;align-items:center;flex:none}
.lb-idx{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:#A9B8C0;margin-right:4px}
.lb-btn{background:none;border:1px solid rgba(255,255,255,.32);color:#E6EDF0;font-family:"IBM Plex Mono",monospace;font-size:12.5px;padding:5px 11px;cursor:pointer;border-radius:5px}
.lb-btn:hover{border-color:#fff}
.lb-btn[disabled]{opacity:.35;cursor:default}
.lb :focus-visible{outline-color:#8FD6E0}
.lb-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border:1px solid rgba(255,255,255,.18);border-radius:4px}
.lb-stage.is-missing .ph{position:static;width:min(560px,100%);aspect-ratio:21/10;border-radius:6px;color:#A9B8C0;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.05) 10px 11px),#151B21}
.lb-cap{margin:0;padding:0 18px 10px;text-align:center;font-size:14px;color:#C5D1D7;flex:none}
.lb-strip{display:flex;gap:8px;padding:10px 16px 16px;justify-content:center;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.14);flex:none}
.lb-strip[hidden]{display:none}
.lb-strip button{width:104px;padding:0;border:1px solid rgba(255,255,255,.25);background:#000;cursor:pointer;overflow:hidden;border-radius:4px;opacity:.6}
.lb-strip button[aria-current="true"]{opacity:1;border-color:#fff}
.lb-strip .thumb-box .ph{background:#151B21}

.qo{position:fixed;inset:0;z-index:70;display:flex;justify-content:center;align-items:flex-start;padding:70px 16px 16px;background:rgba(10,14,18,.35)}
.qo[hidden]{display:none}
.qo-box{width:min(560px,100%);background:var(--bg-elev);border:1px solid var(--rule-strong);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.qo-in{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--rule)}
.qo-in .ico{color:var(--fg-faint)}
.qo input{flex:1;min-width:0;height:44px;border:0;background:none;color:var(--fg);font:15px "IBM Plex Sans",sans-serif;outline:none}
.qo ul{list-style:none;margin:0;padding:6px;max-height:min(60vh,420px);overflow:auto}
.qo li{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.qo li .dir{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--fg-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qo li[aria-selected="true"]{background:var(--sel)}
.qo .none{color:var(--fg-muted);cursor:default}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1100px){
  .pax{grid-template-columns:1fr}
  .spec{grid-template-columns:repeat(2,minmax(0,1fr))}
  .spec div:nth-child(2n){border-right:0}
  .spec div:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .tb-search{min-width:0}
}
@media (max-width:860px){
  body{font-size:16px}

  .dots{display:none}
  .tb-title{text-align:left}

  .tb-search-label,.tb-search kbd{display:none}
  .sidebar{
    position:fixed;z-index:50;top:42px;bottom:0;left:0;width:min(310px,86vw);
    transform:translateX(-100%);visibility:hidden;transition:transform .2s ease,visibility 0s linear .2s;
    box-shadow:none;
  }
  .side-collapsed .sidebar{display:flex}
  .drawer-open .sidebar{transform:none;visibility:visible;transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .side-close{display:inline-flex;align-items:center;justify-content:center}
  .tree-row{height:34px;font-size:14.5px}
  .scrim{position:fixed;inset:42px 0 0 0;z-index:45;background:rgba(10,14,18,.4);border:0}
  .drawer-open .scrim{display:block}
  .doc{--gutter:42px;padding:24px 16px 56px var(--gutter)}
  .ln::before,.cl::before{width:calc(var(--gutter) - 18px);font-size:11px}
  .doc{background-position:calc(var(--gutter) - 10px) 0}
  .lede{font-size:17.5px;--lnh:28px}
  .intro{font-size:16.5px;--lnh:27px}
  .crumbs{padding:0 8px 0 12px}
  .code{font-size:12.5px}
  .cl{--lnh:21.9px}
  .sb-hide{display:none}
  .cred{grid-template-columns:1fr auto}
  .cred .detail{grid-column:1 / -1;grid-row:2}
  .gal-arrow{width:34px;height:34px}
  .gal-thumb{width:72px}
  .lb-strip button{width:68px}
  .lb-btn{padding:5px 8px}
}
@media (max-width:520px){
  .tb-cta{display:none}
  .spec{grid-template-columns:1fr}
  .spec div{border-right:0;border-bottom:1px solid var(--rule)}
  .spec div:last-child{border-bottom:0}
  .crumbs nav{display:none}
  .crumbs{justify-content:flex-end}
  .lb-close-label{display:none}
  .pg{max-width:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}
  .card:hover{transform:none}
}

/* ============================================================

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const mqMobile = window.matchMedia('(max-width: 860px)');
const GROUP_LABELS = { professional: "Professional", personal: "Personal" };
const groupLabel = g => GROUP_LABELS[g] || (g ? g.charAt(0).toUpperCase() + g.slice(1) : 'Other');
const icon = (id, cls = '') => `<svg class="ico ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;

/* ============================================================
   FILE SYSTEM: every explorer entry maps to part of SITE
   ============================================================ */
const LANGS = { ts: 'TypeScript', md: 'Markdown', json: 'JSON', yml: 'YAML' };
const FILES = [];
const addFile = f => {
  f.name = f.path.split('/').pop();
  f.ext = f.name.split('.').pop();
  f.lang = LANGS[f.ext] || 'Plain Text';
  FILES.push(f);
};
addFile({ path: 'README.md', kind: 'readme', title: 'About' });
addFile({ path: 'experience.ts', kind: 'experience', title: SITE.intros.experience.h });
addFile({ path: 'selected-work.md', kind: 'work', title: SITE.intros.work.h });
addFile({ path: 'projects/index.md', kind: 'projects', title: SITE.intros.projects.h, desc: 'projects' });
SITE.tools.forEach((t, i) => addFile({
  path: `projects/${slug(t.group || 'other')}/${slug(t.file || t.name)}.ts`,
  kind: 'tool', tool: i, title: t.name
}));
addFile({ path: 'skills.json', kind: 'skills', title: SITE.intros.skills.h });
addFile({ path: 'credentials.yml', kind: 'credentials', title: SITE.intros.credentials.h });
addFile({ path: 'contact.md', kind: 'contact', title: SITE.intros.contact.h });

const byPath = new Map(FILES.map(f => [f.path, f]));
const TOP_ORDER = FILES.filter(f => f.kind !== 'tool').map(f => f.path);
const TOOL_ORDER = FILES.filter(f => f.kind === 'tool').map(f => f.path);
const toolPath = i => FILES.find(f => f.kind === 'tool' && f.tool === i).path;

/* old section anchors from the single page site still land somewhere sensible */
const LEGACY = { work: 'experience.ts', projects: 'selected-work.md', tooling: 'projects/index.md', skills: 'skills.json', credentials: 'credentials.yml', contact: 'contact.md' };

const fileIcon = path => {
  const ext = path.split('.').pop();
  const map = { ts: ['TS', 'i-ts'], md: ['M↓', 'i-md'], json: ['{ }', 'i-json'], yml: ['YML', 'i-yml'] };
  const [g, c] = map[ext] || ['TXT', ''];
  return `<span class="ficon ${c}" aria-hidden="true">${g}</span>`;
};

/* ============================================================
   PREVIEW RENDERERS
   ============================================================ */
const h1 = text => `<h1 class="ln" tabindex="-1">${esc(text)}</h1>`;
const h2 = (text, cls = '') => `<h2 class="ln ${cls}"><span class="hash" aria-hidden="true">## </span>${esc(text)}</h2>`;
const chips = (arr, label = 'Stack') => `<ul class="chips" aria-label="${esc(label)}">${arr.map(s => `<li>${esc(s)}</li>`).join('')}</ul>`;

function pager(path){
  const f = byPath.get(path);
  const seq = f.kind === 'tool' ? TOOL_ORDER : TOP_ORDER;
  const i = seq.indexOf(path);
  const prev = seq[i - 1], next = seq[i + 1];
  const btn = (p, label, cls) => p
    ? `<button type="button" class="pg ${cls}" data-open="${esc(p)}"><span class="pg-k">${label} &middot; ${esc(byPath.get(p).name)}</span><span class="pg-f">${esc(byPath.get(p).title)}</span></button>`
    : '';
  const up = f.kind === 'tool'
    ? `<button type="button" class="pg up" data-open="projects/index.md"><span class="pg-k">Back to</span><span class="pg-f">All projects</span></button>` : '';
  return `<nav class="ln pager wide" aria-label="File navigation">${btn(prev, '← Previous', 'prev')}${up}${btn(next, 'Next →', 'next')}</nav>`;
}

function cardHTML(t, i){

  return `<article class="card">
    ${thumb}
    <div class="card-body">
      <p class="card-file">${esc(path.replace(/^projects\//, ''))}</p>
      <h3><button type="button" class="card-open" data-open="${esc(path)}">${esc(t.name)}</button></h3>
      <p class="card-short">${esc(t.short)}</p>
      <p class="card-meta"><span>${shots.length ? shots.length + (shots.length === 1 ? ' screenshot' : ' screenshots') : 'screenshots pending'}</span><span class="go" aria-hidden="true">open →</span></p>

}

function galleryHTML(t, i){
  const n = t.shots.length;
  const arrows = n > 1
    ? `<button type="button" class="gal-arrow prev" data-step="-1" aria-label="Previous screenshot">${icon('i-chevl')}</button>
       <button type="button" class="gal-arrow next" data-step="1" aria-label="Next screenshot">${icon('i-chev')}</button>` : '';
  const strip = n > 1
    ? `<div class="gal-strip" role="group" aria-label="Choose a screenshot">${t.shots.map((s, k) =>
        `<button type="button" class="gal-thumb" data-goto="${k}" aria-label="Screenshot ${k + 1}${t.captions[k] ? ': ' + esc(t.captions[k]) : ''}">
           <span class="thumb-box" data-fallback><img src="${esc(s)}" alt="" loading="lazy" decoding="async"><span class="ph" aria-hidden="true"></span></span>
         </button>`).join('')}</div>` : '';
  return `<figure class="ln gal" data-gal="${i}" aria-label="${esc(t.name)} screenshots">
    <div class="gal-stage" data-fallback>
      <button type="button" class="gal-zoom" data-zoom><img class="gal-img" alt="" decoding="async"></button>

}

/* ============================================================
   SOURCE RENDERERS: print SITE data back as typed code
   ============================================================ */
const T = {
  k: s => `<span class="t-k">${s}</span>`,
  t: s => `<span class="t-t">${s}</span>`,
  p: s => `<span class="t-p">${s}</span>`,
  n: s => `<span class="t-n">${s}</span>`,
  u: s => `<span class="t-u">${s}</span>`,
  c: s => `<span class="t-c">${esc(s)}</span>`,
  s: s => `<span class="t-s">${esc(JSON.stringify(s))}</span>`
};

/* serialize a value as highlighted TS or JSON, one "\n" per line */
function ser(v, ind, json){
  const pad = '  '.repeat(ind + 1), end = '  '.repeat(ind);
  if (typeof v === 'string') return T.s(v);
  if (typeof v === 'number' || typeof v === 'boolean') return T.n(String(v));
  if (Array.isArray(v)){
    if (!v.length) return T.u('[]');
    if (v.every(x => typeof x === 'string') && JSON.stringify(v).length < 60)
      return T.u('[') + v.map(T.s).join(T.u(', ')) + T.u(']');
    return T.u('[') + '\n' + v.map((x, i) => pad + ser(x, ind + 1, json) + (json && i === v.length - 1 ? '' : T.u(','))).join('\n') + '\n' + end + T.u(']');
  }
  const keys = Object.keys(v).filter(k => v[k] !== undefined);
  const key = k => json || !/^[A-Za-z_$][\w$]*$/.test(k) ? esc(JSON.stringify(k)) : k;
  return T.u('{') + '\n' + keys.map((k, i) =>
    pad + T.p(key(k)) + T.u(': ') + ser(v[k], ind + 1, json) + (json && i === keys.length - 1 ? '' : T.u(','))
  ).join('\n') + '\n' + end + T.u('}');
}

/* wrap each line, keeping a hanging indent so wrapped strings stay readable */
function codeBlock(html, label){
  const out = html.split('\n').map(line => {
    const lead = line.match(/^ */)[0].length;
    const rest = line.slice(lead);
    return `<span class="cl" data-indent="${lead}" style="padding-left:${lead + 2}ch;text-indent:-2ch">${rest}</span>`;
  }).join('');
  return `<div class="doc code-doc"><pre class="code" aria-label="${esc(label)}"><code>${out}</code></pre></div>`;
}

function hlMd(raw){
  if (/^<!--/.test(raw)) return T.c(raw);
  if (/^#{1,6} /.test(raw)) return `<span class="t-h">${esc(raw)}</span>`;
  return esc(raw)
    .replace(/^(\s*)([-*] )/, '$1<span class="t-u">$2</span>')
    .replace(/\*\*(.+?)\*\*/g, '<span class="t-k">**$1**</span>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<span class="t-u">[</span><span class="t-s">$1</span><span class="t-u">](</span><span class="t-p">$2</span><span class="t-u">)</span>')
    .replace(/`([^`]+)`/g, '<span class="t-n">`$1`</span>')
    .replace(/^_(.+)_$/, '<span class="t-t">_$1_</span>');
}

function hlYml(raw){
  if (/^\s*#/.test(raw)) return T.c(raw);
  const m = raw.match(/^(\s*)(- )?(\w+)(:)(.*)$/);
  if (!m) return esc(raw);
  const [, sp, dash, key, , val] = m;
  const v = val.trim();
  const vh = v === '' ? '' : ' ' + (/^(true|false|\d+)$/.test(v) ? T.n(v) : `<span class="t-s">${esc(v)}</span>`);
  return sp + (dash ? T.u('- ') : '') + T.p(key) + T.u(':') + vh;
}

const MD_NOTE = '<!-- Switch to Preview to render this file. -->';
const TS_NOTE = '// Typed data for this view. Switch to Preview to compile it.';
const yq = s => JSON.stringify(s);

function sourceHTML(f){
  const label = 'Source of ' + f.path;
  const md = arr => codeBlock(arr.map(hlMd).join('\n'), label);

  switch (f.kind){
    case 'readme': {
      const h = SITE.hero;
      return md([MD_NOTE, '', '# ' + h.name, '', '_' + h.role + ', ' + h.location + '_', '', h.lede, h.quiet, '',
        ...h.facts.map(x => `- **${x.k}:** ${x.v}`), '', SITE.footer]);
    }
    case 'work': {
      const s = SITE.intros.work, out = [MD_NOTE, '', '# ' + s.h, '', s.p];
      SITE.cases.forEach(c => out.push('', '## ' + c.title, '_' + c.kicker + '_', '', c.summary, '',
        '**Problem.** ' + c.problem, '**Approach.** ' + c.approach, '**Result.** ' + c.outcome, '',
        c.stack.map(x => '`' + x + '`').join(' ')));
      return md(out);
    }
    case 'projects': {
      const s = SITE.intros.projects, out = [MD_NOTE, '', '# ' + s.h, '', s.p];
      let g = null;
      SITE.tools.forEach((t, i) => {
        if (t.group !== g){ g = t.group; out.push('', '## ' + groupLabel(g)); }
        out.push(`- [${t.name}](./${toolPath(i).replace(/^projects\//, '')}): ${t.short}`);
      });
      return md(out);
    }
    case 'contact': {
      const s = SITE.intros.contact;
      return md([MD_NOTE, '', '# ' + s.h, '', ...SITE.contact.map(c => `- ${c.label}: [${c.text}](${c.href})`), '', SITE.footer]);
    }
    case 'experience': {
      const s = SITE.intros.experience;
      const html = [
        T.c(TS_NOTE),
        T.c('// ' + s.h + ': ' + s.p),
        '',
        T.k('interface') + ' ' + T.t('Role') + ' ' + T.u('{'),
        '  ' + T.p('when') + T.u(': ') + T.t('string') + T.u(';'),
        '  ' + T.p('title') + T.u(': ') + T.t('string') + T.u(';'),
        '  ' + T.p('org') + T.u(': ') + T.t('string') + T.u(';'),
        '  ' + T.p('points') + T.u(': ') + T.t('string[]') + T.u(';'),
        T.u('}'),
        '',
        T.k('export const') + ' roles' + T.u(': ') + T.t('Role[]') + T.u(' = ') + ser(SITE.roles, 0, false) + T.u(';')
      ].join('\n');
      return codeBlock(html, label);
    }
    case 'tool': {
      const t = SITE.tools[f.tool];
      const html = [
        T.c(TS_NOTE),
        '',
        T.k('type') + ' ' + T.t('Section') + T.u(' = { ') + T.p('h') + T.u(': ') + T.t('string') + T.u('; ') + T.p('p') + T.u('?: ') + T.t('string') + T.u('; ') + T.p('list') + T.u('?: ') + T.t('string[]') + T.u(' };'),
        '',
        T.k('interface') + ' ' + T.t('Tool') + ' ' + T.u('{'),
        '  ' + T.p('name') + T.u(': ') + T.t('string') + T.u(';'),
        '  ' + T.p('group') + T.u(': ') + T.s('professional') + T.u(' | ') + T.s('personal') + T.u(';'),
        '  ' + T.p('short') + T.u(': ') + T.t('string') + T.u(';'),
        '  ' + T.p('status') + T.u('?: ') + T.t('string') + T.u(';'),
        '  ' + T.p('shots') + T.u(': ') + T.t('string[]') + T.u(';'),
        '  ' + T.p('captions') + T.u(': ') + T.t('string[]') + T.u(';'),
        '  ' + T.p('sections') + T.u(': ') + T.t('Section[]') + T.u(';'),
        '  ' + T.p('stack') + T.u(': ') + T.t('string[]') + T.u(';'),
        T.u('}'),
        '',
        T.k('const') + ' tool' + T.u(': ') + T.t('Tool') + T.u(' = ') + ser(t, 0, false) + T.u(';'),
        '',
        T.k('export default') + ' tool' + T.u(';')
      ].join('\n');
      return codeBlock(html, label);
    }
    case 'skills': {
      const obj = {};
      SITE.skills.forEach(g => { obj[g.group] = g.items; });
      return codeBlock(ser(obj, 0, true), label);
    }
    case 'credentials': {
      const s = SITE.intros.credentials;
      const out = ['# Switch to Preview to render this file.', '# ' + s.h + ': ' + s.p, '', 'credentials:'];
      SITE.credentials.forEach(c => out.push(
        '  - name: ' + yq(c.name),
        '    detail: ' + yq(c.detail),
        '    status: ' + yq(c.status),
        '    active: ' + c.active
      ));
      return codeBlock(out.map(hlYml).join('\n'), label);
    }
  }
  return emptyPreview();
}

/* ============================================================
   CHROME: explorer, tabs, breadcrumbs, status
   ============================================================ */
function buildTree(){
  const root = { children: [] };
  FILES.forEach(f => {
    const parts = f.path.split('/');
    let node = root, acc = '';
    parts.slice(0, -1).forEach(p => {
      acc = acc ? acc + '/' + p : p;
      let c = node.children.find(x => x.dir && x.name === p);
      if (!c){ c = { name: p, dir: true, path: acc, children: [] }; node.children.push(c); }
      node = c;
    });
    node.children.push({ name: parts[parts.length - 1], file: f });
  });
  const html = (nodes, d) => `<ul class="tree" role="list">${nodes.map(n => n.dir
    ? `<li><button type="button" class="tree-row tree-dir" data-folder="${esc(n.path)}" aria-expanded="true" style="--d:${d}">${icon('i-chev', 'chev')}${icon('i-folder', 'folder')}<span class="nm">${esc(n.name)}</span></button>${html(n.children, d + 1)}</li>`
    : `<li><button type="button" class="tree-row tree-file" data-open="${esc(n.file.path)}" style="--d:${d}" title="${esc(n.file.title)}">${fileIcon(n.file.path)}<span class="nm">${esc(n.name)}</span></button></li>`
  ).join('')}</ul>`;
  $('#tree').innerHTML = html(root.children, 0);
}

function renderTabs(){
  $('#tabs').innerHTML = state.tabs.map(p => {
    const f = byPath.get(p), on = p === state.active;
    return `<div class="tab${on ? ' on' : ''}">
      <button type="button" class="tab-btn" data-open="${esc(p)}" aria-current="${on ? 'page' : 'false'}" title="${esc(p)}">${fileIcon(p)}<span>${esc(f.name)}</span>${f.desc ? `<span class="tab-desc">${esc(f.desc)}</span>` : ''}</button>
      <button type="button" class="tab-x" data-close="${esc(p)}" aria-label="Close ${esc(f.name)}">&times;</button>
    </div>`;
  }).join('');
  const on = $('#tabs .tab.on');
  if (on){
    const bar = $('#tabs');
    if (on.offsetLeft < bar.scrollLeft) bar.scrollLeft = on.offsetLeft;
    else if (on.offsetLeft + on.offsetWidth > bar.scrollLeft + bar.clientWidth) bar.scrollLeft = on.offsetLeft + on.offsetWidth - bar.clientWidth;
  }
}

function renderChrome(){
  const f = state.active ? byPath.get(state.active) : null;
  $$('#tree .tree-file').forEach(b => b.setAttribute('aria-current', b.dataset.open === state.active ? 'page' : 'false'));
  const crumbs = ['cjportfolio', ...(f ? f.path.split('/') : [])];
  $('#crumbs').innerHTML = `<ol>${crumbs.map((c, i) => `<li${i === crumbs.length - 1 ? ' aria-current="location"' : ''}>${i === crumbs.length - 1 && f ? fileIcon(f.path) : ''}${esc(c)}</li>`).join('')}</ol>`;
  $$('.mode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === state.mode));
  $('#sb-lang').textContent = f ? (state.mode === 'source' ? f.lang : f.lang + ' Preview') : 'Plain Text';
  document.title = !f || f.kind === 'readme' ? 'Christian Jones - IT Specialist' : `${f.name} | Christian Jones - IT Specialist`;
  renderTabs();
}

let msgTimer = null;
function flash(msg){
  const el = $('#sb-msg');
  el.textContent = msg;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { el.textContent = ''; }, 3200);
}

function setPos(ln, col){ $('#sb-pos').textContent = `Ln ${ln}, Col ${col}`; }

/* ============================================================
   RENDER
   ============================================================ */
const scrollKey = () => state.active + '|' + state.mode;

function render(){
  const t0 = performance.now();
  const f = state.active ? byPath.get(state.active) : null;
  docEl.innerHTML = !f ? emptyPreview() : state.mode === 'source' ? sourceHTML(f) : previewHTML(f);
  $$('.gal[data-gal]', docEl).forEach(paintGallery);
  lines = $$('.ln, .cl', docEl);
  renderChrome();
  scroller.scrollTop = state.scroll[scrollKey()] || 0;
  updatePos();
  scheduleMinimap();
  return performance.now() - t0;
}

function openFile(path, opts = {}){
  if (!byPath.has(path)) path = 'README.md';
  if (state.active) state.scroll[scrollKey()] = scroller.scrollTop;
  if (!state.tabs.includes(path)) state.tabs.push(path);
  const changed = state.active !== path;
  state.active = path;
  const hash = '#/' + path;
  if (opts.push !== false && location.hash !== hash){
    try { history.pushState(null, '', hash); } catch (e) { location.hash = hash; }
  }
  render();
  if (mqMobile.matches && document.body.classList.contains('drawer-open')) setDrawer(false, false);
  if (opts.focus) focusDoc();
  if (changed && opts.announce !== false) flash('Opened ' + path);
}

function closeTab(path){
  const i = state.tabs.indexOf(path);
  if (i < 0) return;
  state.tabs.splice(i, 1);
  delete state.scroll[path + '|preview'];
  delete state.scroll[path + '|source'];
  if (state.active === path){
    const next = state.tabs[i] || state.tabs[i - 1] || null;
    if (next){ openFile(next, { announce: false }); }
    else {
      state.active = null;
      try { history.pushState(null, '', location.pathname + location.search); } catch (e) {}
      render();
    }
  } else renderTabs();
  const tab = $('#tabs .tab.on .tab-btn');
  (tab || docEl.querySelector('h1') || scroller).focus({ preventScroll: true });
}

function focusDoc(){
  const h = docEl.querySelector('h1');
  (state.mode === 'preview' && h ? h : scroller).focus({ preventScroll: true });
}

function setMode(m){
  if (m === state.mode) return;
  if (state.active) state.scroll[scrollKey()] = scroller.scrollTop;
  state.mode = m;
  const ms = render();
  const f = state.active ? byPath.get(state.active) : null;
  if (!f) return;
  if (m === 'preview'){
    const d = docEl.firstElementChild;
    if (d && !reduceMotion){ d.classList.add('compiled'); d.addEventListener('animationend', () => d.classList.remove('compiled'), { once: true }); }
    flash(`Compiled ${f.name} in ${Math.max(ms, 0.1).toFixed(1)} ms`);
  } else {
    flash(`Showing source of ${f.name}, ${lines.length} lines`);
  }
}

/* ============================================================
   GALLERY (inside a project file)
   ============================================================ */
function paintGallery(fig){
  const i = Number(fig.dataset.gal), t = SITE.tools[i], n = t.shots.length;
  let k = state.gal[i] || 0;
  if (k >= n || k < 0) k = 0;
  state.gal[i] = k;
  const stage = $('.gal-stage', fig), img = $('.gal-img', fig);
  const src = t.shots[k], cap = (t.captions || [])[k] || '';
  if (img.getAttribute('src') !== src){ stage.classList.remove('is-missing'); img.src = src; }
  img.alt = cap || `${t.name} screenshot ${k + 1}`;
  $('.gal-zoom', fig).setAttribute('aria-label', `View full size, screenshot ${k + 1} of ${n}${cap ? ': ' + cap : ''}`);
  $('.gal-num', fig).textContent = `${k + 1} / ${n}`;
  $('.gal-text', fig).textContent = cap;
  $$('.gal-thumb', fig).forEach((b, j) => b.setAttribute('aria-current', j === k ? 'true' : 'false'));
}
function stepGallery(fig, d){
  const i = Number(fig.dataset.gal), n = SITE.tools[i].shots.length;
  if (n < 2) return;
  state.gal[i] = ((state.gal[i] || 0) + d + n) % n;
  paintGallery(fig);
}

/* ============================================================
   FULL SIZE VIEWER
   ============================================================ */
const lb = $('#lb'), lbImg = $('#lb-img'), lbStage = $('#lb-stage'), lbStrip = $('#lb-strip');
const lbPrev = $('#lb-prev'), lbNext = $('#lb-next');
let view = { tool: -1, shots: [], captions: [], n: 0, name: '' };
let lbReturn = null;

function paintViewer(){
  const { shots, captions, n, name } = view;
  const cap = captions[n] || '';
  if (lbImg.getAttribute('src') !== shots[n]){ lbStage.classList.remove('is-missing'); lbImg.src = shots[n]; }
  lbImg.alt = cap || `${name} screenshot ${n + 1}`;
  $('#lb-title').textContent = name;
  $('#lb-cap').textContent = cap;
  $('#lb-idx').textContent = `${n + 1} / ${shots.length}`;
  lbPrev.disabled = lbNext.disabled = shots.length < 2;
  $$('button', lbStrip).forEach((b, i) => b.setAttribute('aria-current', i === n ? 'true' : 'false'));
}

function openViewer(toolIndex, startAt){
  const t = SITE.tools[toolIndex];
  if (!t || !t.shots || !t.shots.length) return;
  const active = document.activeElement;
  lbReturn = active && active !== document.body ? active : docEl.querySelector(`.gal[data-gal="${toolIndex}"] .gal-zoom`);
  view = { tool: toolIndex, shots: t.shots, captions: t.captions || [], n: startAt || 0, name: t.name };
  lbStrip.innerHTML = t.shots.map((s, i) =>
    `<button type="button" data-n="${i}" aria-label="Screenshot ${i + 1}${view.captions[i] ? ': ' + esc(view.captions[i]) : ''}"><span class="thumb-box" data-fallback><img src="${esc(s)}" alt=""><span class="ph" aria-hidden="true"></span></span></button>`).join('');
  lbStrip.hidden = t.shots.length < 2;
  lbImg.removeAttribute('src');
  paintViewer();
  lb.hidden = false;
  $('#app').inert = true;
  $('#lb-close').focus();
}
function closeViewer(){
  if (lb.hidden) return;
  lb.hidden = true;
  $('#app').inert = false;
  lbImg.removeAttribute('src');
  /* keep the inline gallery on the frame the visitor ended on */
  state.gal[view.tool] = view.n;
  const fig = docEl.querySelector(`.gal[data-gal="${view.tool}"]`);
  if (fig) paintGallery(fig);
  if (lbReturn && document.contains(lbReturn)) lbReturn.focus();
}
const stepViewer = d => { if (view.shots.length < 2) return; view.n = (view.n + d + view.shots.length) % view.shots.length; paintViewer(); };

lbPrev.addEventListener('click', () => stepViewer(-1));
lbNext.addEventListener('click', () => stepViewer(1));
$('#lb-close').addEventListener('click', closeViewer);
lbStrip.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b){ view.n = Number(b.dataset.n); paintViewer(); }
});
lbStage.addEventListener('click', e => { if (e.target !== lbImg) closeViewer(); });
let touchX = null;
lbStage.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
lbStage.addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  touchX = null;
  if (Math.abs(dx) > 50) stepViewer(dx < 0 ? 1 : -1);
});

/* ============================================================
   QUICK OPEN
   ============================================================ */
const qo = $('#qo'), qoInput = $('#qo-input'), qoList = $('#qo-list');
let qoItems = [], qoSel = 0, qoReturn = null;

function openQO(){
  qoReturn = document.activeElement;
  qo.hidden = false;
  $('#app').inert = true;
  qoInput.value = '';
  filterQO();
  qoInput.focus();
}
function closeQO(restore = true){

}
function filterQO(){
  const q = qoInput.value.trim().toLowerCase();
  qoItems = FILES.filter(f => !q || f.path.toLowerCase().includes(q) || f.title.toLowerCase().includes(q));
  qoSel = 0;
  paintQO();
}
function paintQO(){
  if (!qoItems.length){
    qoList.innerHTML = '<li class="none" role="option" aria-disabled="true" aria-selected="false">No matching files</li>';
    qoInput.removeAttribute('aria-activedescendant');
    return;
  }
  qoList.innerHTML = qoItems.map((f, i) =>
    `<li id="qo-${i}" role="option" aria-selected="${i === qoSel}" data-pick="${esc(f.path)}">${fileIcon(f.path)}<span>${esc(f.name)}</span><span class="dir">${esc(f.title)}${f.path.includes('/') ? ' &middot; ' + esc(f.path.split('/').slice(0, -1).join('/')) : ''}</span></li>`).join('');
  qoInput.setAttribute('aria-activedescendant', 'qo-' + qoSel);
  const sel = $('#qo-' + qoSel);
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}
qoInput.addEventListener('input', filterQO);
qoInput.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    if (!qoItems.length) return;
    qoSel = (qoSel + (e.key === 'ArrowDown' ? 1 : -1) + qoItems.length) % qoItems.length;
    paintQO();
  } else if (e.key === 'Enter'){
    e.preventDefault();
    if (qoItems[qoSel]){ closeQO(false); openFile(qoItems[qoSel].path, { focus: true }); }
  }
});
qoList.addEventListener('click', e => {
  const li = e.target.closest('[data-pick]');
  if (li){ closeQO(false); openFile(li.dataset.pick, { focus: true }); }
});
qo.addEventListener('click', e => { if (e.target === qo) closeQO(); });

/* ============================================================
   EXPLORER: desktop collapse and mobile drawer
   ============================================================ */
function setDrawer(open, restore = true){
  document.body.classList.toggle('drawer-open', open);
  $('#menu-btn').setAttribute('aria-expanded', open);
  $('#main').inert = open;
  $('#status').inert = open;
  if (open){
    const cur = $('#tree [aria-current="page"]') || $('#tree .tree-row');
    if (cur) cur.focus();
  } else if (restore) $('#menu-btn').focus();
}
function toggleExplorer(){
  if (mqMobile.matches) return setDrawer(!document.body.classList.contains('drawer-open'));
  const collapsed = document.body.classList.toggle('side-collapsed');
  $('#act-explorer').setAttribute('aria-expanded', !collapsed);
  scheduleMinimap();
}
$('#menu-btn').addEventListener('click', toggleExplorer);
$('#act-explorer').addEventListener('click', toggleExplorer);
$('#side-close').addEventListener('click', () => setDrawer(false));
$('#scrim').addEventListener('click', () => setDrawer(false));
mqMobile.addEventListener('change', () => {
  scheduleMinimap();
  if (mqMobile.matches) return;
  document.body.classList.remove('drawer-open');
  $('#menu-btn').setAttribute('aria-expanded', 'false');
  $('#main').inert = false;
  $('#status').inert = false;
  scheduleMinimap();
});
$('#act-search').addEventListener('click', openQO);
$('#qo-btn').addEventListener('click', openQO);

/* ============================================================
   THEME
   ============================================================ */
function applyThemeUI(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  $('#theme-btn').setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  $('#sb-theme').textContent = dark ? 'Dark' : 'Light';
  $('#sb-theme').setAttribute('aria-label', dark ? 'Dark theme, switch to light' : 'Light theme, switch to dark');
}
function toggleTheme(){
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('cj-editor-theme', next); } catch (e) {}
  applyThemeUI();
  flash('Color theme: ' + (next === 'dark' ? 'Dark' : 'Light'));
}
$('#theme-btn').addEventListener('click', toggleTheme);
$('#sb-theme').addEventListener('click', toggleTheme);

/* ============================================================
   MINIMAP AND CURSOR POSITION
   ============================================================ */
const mm = $('#minimap'), mmBars = $('#mm-bars'), mmView = $('#mm-view');
let mmScale = 0.1, mmPending = 0;

function scheduleMinimap(){
  cancelAnimationFrame(mmPending);
  mmPending = requestAnimationFrame(buildMinimap);
}
function buildMinimap(){
  if (getComputedStyle(mm).display === 'none') return;
  const inner = docEl.firstElementChild;
  if (!inner){ mmBars.innerHTML = ''; return; }
  const H = Math.max(scroller.scrollHeight, 1), mh = mmBars.clientHeight || mm.clientHeight;
  mmScale = Math.min(0.15, mh / H);
  const base = inner.offsetTop;
  mmBars.innerHTML = lines.map(el => {
    const top = (base + el.offsetTop) * mmScale;
    const h = Math.max(2, el.offsetHeight * mmScale - 1);
    const code = el.classList.contains('cl');
    const len = el.textContent.trim().length;
    const ind = code ? Number(el.dataset.indent || 0) * 3 : 0;
    const w = Math.max(6, Math.min(100 - ind, code ? len * 1.3 : 30 + len * 0.5));
    const cls = /^H[12]$/.test(el.tagName) || el.classList.contains('role-head') ? 'h' : code ? 'c' : '';
    return len ? `<i class="${cls}" style="top:${top.toFixed(1)}px;height:${h.toFixed(1)}px;left:${ind}%;width:${w}%"></i>` : '';
  }).join('');
  paintMinimap();
}
function paintMinimap(){
  mmView.style.top = (6 + scroller.scrollTop * mmScale) + 'px';
  mmView.style.height = Math.max(12, scroller.clientHeight * mmScale) + 'px';
}
let mmDrag = false;
const mmJump = e => {
  const y = e.clientY - mmBars.getBoundingClientRect().top;
  scroller.scrollTop = y / mmScale - scroller.clientHeight / 2;
};
mm.addEventListener('pointerdown', e => { mmDrag = true; mm.setPointerCapture(e.pointerId); mmJump(e); });
mm.addEventListener('pointermove', e => { if (mmDrag) mmJump(e); });
mm.addEventListener('pointerup', () => { mmDrag = false; });
mm.addEventListener('pointercancel', () => { mmDrag = false; });

function updatePos(){
  const inner = docEl.firstElementChild;
  if (!inner || !lines.length){ setPos(1, 1); return; }
  const st = scroller.scrollTop, base = inner.offsetTop;
  let i = 0;
  while (i < lines.length - 1 && base + lines[i].offsetTop + lines[i].offsetHeight <= st + 4) i++;
  setPos(i + 1, 1);
}
let posFrame = 0;
scroller.addEventListener('scroll', () => {
  cancelAnimationFrame(posFrame);
  posFrame = requestAnimationFrame(() => { updatePos(); paintMinimap(); });
}, { passive: true });

/* clicking into the text moves the "cursor" in the status bar */
function caretPos(){
  const sel = window.getSelection();
  if (!sel || !sel.anchorNode || !docEl.contains(sel.anchorNode)) return;
  const node = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
  const el = node && node.closest('.ln, .cl');
  const idx = lines.indexOf(el);
  if (idx < 0) return;
  let col = 1;
  try {
    const r = document.createRange();
    r.setStart(el, 0);
    r.setEnd(sel.anchorNode, sel.anchorOffset);
    col = r.toString().length + 1 + Number(el.dataset.indent || 0);
  } catch (e) {}
  setPos(idx + 1, col);
}
scroller.addEventListener('mouseup', () => setTimeout(caretPos, 0));

if ('ResizeObserver' in window) new ResizeObserver(scheduleMinimap).observe(scroller);
else window.addEventListener('resize', scheduleMinimap);

/* ============================================================
   IMAGE FALLBACK: any listed shot missing from disk becomes a placeholder
   ============================================================ */
document.addEventListener('error', e => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement)) return;
  const box = img.closest('[data-fallback]');
  if (box) box.classList.add('is-missing');
}, true);
docEl.addEventListener('load', e => { if (e.target instanceof HTMLImageElement) scheduleMinimap(); }, true);

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', e => {
  const opener = e.target.closest('[data-open]');
  if (opener && !opener.closest('#qo')){
    e.preventDefault();
    const fromTabs = !!opener.closest('#tabs');
    openFile(opener.dataset.open, { focus: !fromTabs });
    return;
  }
  const closer = e.target.closest('[data-close]');
  if (closer){ closeTab(closer.dataset.close); return; }

  const folder = e.target.closest('[data-folder]');
  if (folder){
    const open = folder.getAttribute('aria-expanded') !== 'true';
    folder.setAttribute('aria-expanded', open);
    folder.nextElementSibling.hidden = !open;
    return;
  }
  const mode = e.target.closest('[data-mode]');
  if (mode){ setMode(mode.dataset.mode); return; }
  if (e.target.closest('[data-qo]')){ openQO(); return; }

  const fig = e.target.closest('.gal[data-gal]');
  if (fig){
    const stepBtn = e.target.closest('[data-step]');
    if (stepBtn){ stepGallery(fig, Number(stepBtn.dataset.step)); return; }
    const go = e.target.closest('[data-goto]');
    if (go){ state.gal[fig.dataset.gal] = Number(go.dataset.goto); paintGallery(fig); return; }
    if (e.target.closest('[data-zoom]')){ const i = Number(fig.dataset.gal); openViewer(i, state.gal[i] || 0); }
  }
});

/* middle click closes a tab, like a real editor */
$('#tabs').addEventListener('auxclick', e => {
  const t = e.target.closest('.tab');
  if (e.button === 1 && t){ e.preventDefault(); closeTab($('.tab-x', t).dataset.close); }
});

/* arrow keys page an inline gallery while focus is inside it */
docEl.addEventListener('keydown', e => {
  const fig = e.target.closest && e.target.closest('.gal[data-gal]');
  if (!fig) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
    e.preventDefault();
    stepGallery(fig, e.key === 'ArrowRight' ? 1 : -1);
  }
});

/* keep Tab inside whichever dialog is open */
function trapFocus(e, root){
  const f = $$('button:not([disabled]):not([hidden]), input, [href], [tabindex]:not([tabindex="-1"])', root)
    .filter(el => el.offsetParent !== null || el === document.activeElement);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}

document.addEventListener('keydown', e => {
  if (!lb.hidden){
    if (e.key === 'Escape'){ e.preventDefault(); closeViewer(); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); stepViewer(1); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); stepViewer(-1); }
    else if (e.key === 'Tab') trapFocus(e, lb);
    return;
  }
  if (!qo.hidden){
    if (e.key === 'Escape'){ e.preventDefault(); closeQO(); }
    else if (e.key === 'Tab') trapFocus(e, qo);
    return;
  }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key || '').toLowerCase() === 'k'){
    e.preventDefault();
    openQO();
    return;
  }
  if (e.key === 'Escape' && document.body.classList.contains('drawer-open')) setDrawer(false);
  else if (e.key === 'Tab' && document.body.classList.contains('drawer-open')) trapFocus(e, $('#sidebar'));
});

/* ============================================================
   ROUTING AND BOOT
   ============================================================ */
function pathFromHash(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  if (!h) return null;
  if (byPath.has(h)) return h;
  if (LEGACY[h]) return LEGACY[h];
  return null;
}
function onRoute(){
  const p = pathFromHash();
  if (p && p !== state.active) openFile(p, { push: false, announce: false });
}
window.addEventListener('popstate', onRoute);
window.addEventListener('hashchange', onRoute);

$('#side-links').innerHTML = SITE.contact.map(c =>
  `<li><a href="${esc(c.href)}"${c.external ? ' target="_blank" rel="noopener noreferrer"' : ''}>${esc(c.text)}</a></li>`).join('');

buildTree();
applyThemeUI();
{
  const start = pathFromHash();
  if (start && start !== 'README.md') state.tabs.push(start);
  state.active = start || 'README.md';
  if (start && location.hash !== '#/' + start){
    try { history.replaceState(null, '', '#/' + start); } catch (e) {}
  }
  render();
}
</script>
